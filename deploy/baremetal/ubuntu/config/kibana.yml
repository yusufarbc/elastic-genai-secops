# Installed to /etc/kibana/kibana.yml by elk_setup_ubuntu_jammy.sh
# Kibana is served over plain HTTP; put a TLS reverse proxy in front of it for production use.
server.host: "${KIBANA_BIND}"
server.port: 5601

elasticsearch.hosts: ["https://localhost:9200"]
elasticsearch.username: "kibana_system"
# elasticsearch.password is stored in the Kibana keystore
elasticsearch.ssl.certificateAuthorities: ["/etc/kibana/certs/ca.crt"]
elasticsearch.ssl.verificationMode: full

# Values come from /etc/kibana/kibana.env (created by the installer, mode 0600)
xpack.security.encryptionKey: "${KBN_SECURITY_KEY}"
xpack.encryptedSavedObjects.encryptionKey: "${KBN_SAVEDOBJ_KEY}"
xpack.reporting.encryptionKey: "${KBN_REPORTING_KEY}"
