# Production shape shared by the onprem and gke overlays: 3 Elasticsearch nodes on separate
# hosts with a PodDisruptionBudget, 2 Kibana instances, 2 replicas of the stateless services.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pdb.yaml

replicas:
  - { name: enrichment-service, count: 2 }
  - { name: masking-service, count: 2 }
  - { name: case-service, count: 2 }
  - { name: bff, count: 2 }

patches:
  - target: { kind: Elasticsearch, name: esm }
    patch: |-
      - op: replace
        path: /spec/nodeSets/0/count
        value: 3
      - op: replace
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/env/0/value
        value: "-Xms2g -Xmx2g"
      - op: replace
        path: /spec/nodeSets/0/podTemplate/spec/containers/0/resources
        value: { requests: { cpu: "1", memory: 4Gi }, limits: { memory: 4Gi } }
      - op: replace
        path: /spec/nodeSets/0/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 200Gi
      - op: add
        path: /spec/nodeSets/0/podTemplate/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    elasticsearch.k8s.elastic.co/cluster-name: esm
  - target: { kind: Kibana, name: esm }
    patch: |-
      - op: replace
        path: /spec/count
        value: 2
