# The only service that calls an LLM. The token budget is per replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: llm-orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: llm-orchestrator, app.kubernetes.io/component: platform }
    spec:
      serviceAccountName: esm-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: llm-orchestrator
          image: esm/llm-orchestrator
          envFrom:
            - configMapRef: { name: esm-platform-config }
          env:
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: esm-secrets, key: ESM_PLATFORM_PASSWORD } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: esm-secrets, key: LLM_API_KEY, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: es-ca, mountPath: /etc/esm/es-ca, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: es-ca
          secret:
            secretName: esm-es-http-certs-public
