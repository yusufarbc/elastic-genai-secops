# Notifications and tickets for case events (docs/integrations/outbound.md). Stateless.
# Channel URLs and API keys come from the optional Secret esm-outbound, e.g.:
#   kubectl -n esm create secret generic esm-outbound \
#     --from-literal=SLACK_WEBHOOK_URL=https://hooks.slack.com/... --from-literal=ABUSEIPDB_API_KEY=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbound-service
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: outbound-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: outbound-service, app.kubernetes.io/component: platform }
    spec:
      serviceAccountName: esm-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: outbound-service
          image: esm/outbound-service
          envFrom:
            - configMapRef: { name: esm-platform-config }
            - secretRef: { name: esm-outbound, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
