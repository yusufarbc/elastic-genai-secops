# Stateless; scale with replicas (durable NATS consumer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-service
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: enrichment-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: enrichment-service, app.kubernetes.io/component: platform }
    spec:
      serviceAccountName: esm-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: enrichment-service
          image: esm/enrichment-service
          envFrom:
            - configMapRef: { name: esm-platform-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
