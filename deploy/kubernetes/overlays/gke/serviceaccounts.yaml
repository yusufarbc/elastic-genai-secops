# Workload Identity: Elasticsearch pods use this account to write snapshots to GCS.
# Replace PROJECT_ID and grant esm-snapshots@ roles/storage.objectAdmin on the snapshot bucket
# (docs/deployment/kubernetes.md). The esm-platform account is annotated in kustomization.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: esm-elasticsearch
  namespace: esm
  annotations:
    iam.gke.io/gcp-service-account: esm-snapshots@PROJECT_ID.iam.gserviceaccount.com
