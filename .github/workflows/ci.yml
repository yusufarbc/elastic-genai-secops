name: CI

# lint -> test -> image build -> image scan -> push (main only).
# The LLM is always mocked in CI; the billed API is never called (CLAUDE.md section 7).

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock

jobs:
  go:
    name: Go · vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l libs services)" || (gofmt -l libs services; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  python:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [masking-service, enrichment-service, llm-orchestrator, mcp-server, outbound-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff -e libs/py-common -e "integrations/outbound[dev]" -e "services/${{ matrix.service }}[dev]"
      - run: ruff check libs/py-common services/${{ matrix.service }}
      - run: python -m pytest -q tests
        working-directory: services/${{ matrix.service }}

  outbound-adapters:
    name: Python · integrations/outbound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff -e libs/py-common -e "integrations/outbound[dev]"
      - run: ruff check integrations/outbound
      - run: python -m pytest -q tests
        working-directory: integrations/outbound

  content:
    name: Content · rules + configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: Detection rules are built from rules.yml
        run: python content/detection-rules/build.py --check
      - name: Shell scripts
        run: shellcheck -S warning content/bootstrap.sh deploy/baremetal/ubuntu/elk_setup_ubuntu_jammy.sh deploy/compose/init-env.sh
      - name: Compose files
        run: |
          cd deploy/compose
          cp .env.example .env && sed -i 's/__GENERATE__/ci-placeholder-0123456789abcdef/' .env
          docker compose -f siem.yml -f platform.yml config --quiet
      - name: Kubernetes overlays (kustomize + kubeconform, ECK CRD schemas)
        run: |
          ECK=3.5.0
          curl -sSfL "https://download.elastic.co/downloads/eck/${ECK}/crds.yaml" -o /tmp/crds.yaml
          python - <<'EOF'
          import json, pathlib, yaml
          out = pathlib.Path("/tmp/schemas")
          def strict(n):
              if isinstance(n, dict):
                  if n.get("type") == "object" and "properties" in n and "additionalProperties" not in n \
                          and not n.get("x-kubernetes-preserve-unknown-fields"):
                      n["additionalProperties"] = False
                  for v in n.values(): strict(v)
              elif isinstance(n, list):
                  for v in n: strict(v)
              return n
          for d in yaml.safe_load_all(open("/tmp/crds.yaml")):
              if not d or d.get("kind") != "CustomResourceDefinition": continue
              for v in d["spec"]["versions"]:
                  s = strict(v["schema"]["openAPIV3Schema"]); s.setdefault("properties", {})
                  s["properties"].update(apiVersion={"type": "string"}, kind={"type": "string"},
                                         metadata={"type": "object"})
                  p = out / d["spec"]["group"] / f"{d['spec']['names']['kind'].lower()}_{v['name']}.json"
                  p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(s))
          EOF
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          for o in lab onprem gke; do
            sh deploy/kubernetes/init-secrets.sh "$o"
            kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/kubernetes/overlays/$o" \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location '/tmp/schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'
          done

  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go, python]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [detection-service, alert-gateway, case-service, bff,
                  masking-service, enrichment-service, llm-orchestrator, mcp-server,
                  outbound-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: esm/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: esm/${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          docker tag esm/${{ matrix.service }}:ci "$image:${GITHUB_SHA::12}"
          docker tag esm/${{ matrix.service }}:ci "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
