name: CI

# lint -> test -> image build -> image scan -> push (main only).
# The LLM is always mocked in CI; the billed API is never called (CLAUDE.md section 7).

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock

jobs:
  go:
    name: Go · vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l libs services)" || (gofmt -l libs services; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  python:
    name: Python · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [masking-service, enrichment-service, llm-orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff -e libs/py-common -e "services/${{ matrix.service }}[dev]"
      - run: ruff check libs/py-common services/${{ matrix.service }}
      - run: python -m pytest -q tests
        working-directory: services/${{ matrix.service }}

  content:
    name: Content · rules + configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: Detection rules are built from rules.yml
        run: python content/detection-rules/build.py --check
      - name: Shell scripts
        run: shellcheck -S warning content/bootstrap.sh deploy/baremetal/ubuntu/elk_setup_ubuntu_jammy.sh deploy/compose/init-env.sh
      - name: Compose files
        run: |
          cd deploy/compose
          cp .env.example .env && sed -i 's/__GENERATE__/ci-placeholder-0123456789abcdef/' .env
          docker compose -f siem.yml -f platform.yml config --quiet

  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go, python]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [detection-service, alert-gateway, case-service, bff,
                  masking-service, enrichment-service, llm-orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: esm/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: esm/${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          docker tag esm/${{ matrix.service }}:ci "$image:${GITHUB_SHA::12}"
          docker tag esm/${{ matrix.service }}:ci "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
