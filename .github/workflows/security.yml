name: Security

# Secret scanning over the full history, static analysis, and dependency review for PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, test]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets · gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  # CodeQL and dependency review need GitHub Advanced Security on private repositories;
  # they run automatically once the repository is public.
  codeql:
    name: SAST · CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.26"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: SCA · dependency review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
