name: OpenSSF Scorecard

# Supply-chain posture of the repository (branch protection, pinned dependencies, token permissions,
# signed releases ...). Results appear in the Security tab and on the public Scorecard API.
# Kept separate from the pipeline: publish_results requires a minimal, dedicated workflow.

on:
  push:
    branches: [production]
  schedule:
    - cron: "41 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
