name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: target
    attributes:
      label: Deployment target
      options: [Docker Compose, Kubernetes lab, Kubernetes onprem, Kubernetes gke, Bare-metal Ubuntu, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, API keys, internal hostnames and IP addresses first.
      render: text
