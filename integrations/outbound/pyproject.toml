[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "esm-outbound"
version = "0.1.0"
description = "Notifier, ticketing and threat-intel adapters for Elastic-SecOps-Mastery"
requires-python = ">=3.12"
dependencies = [
    "esm-common",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["esm_outbound*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["esm_outbound"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
