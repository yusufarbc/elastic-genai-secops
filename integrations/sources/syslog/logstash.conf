# Pipeline: syslog
# Input:  RFC3164 on 5514/udp and 5514/tcp, RFC5424 on 5515/tcp
# Output: data stream logs-syslog-<namespace>
#
# Connection settings come from the environment (see integrations/sources/README.md):
#   ES_HOSTS, ES_USER, ES_PW, ES_CA_CERT, ES_NAMESPACE

input {
  udp { id => "syslog_udp_5514" port => 5514 }
  tcp { id => "syslog_tcp_5514" port => 5514 }
  tcp { id => "syslog_tcp_5515" port => 5515 tags => ["rfc5424"] }
}

filter {
  mutate {
    add_tag   => ["syslog"]
    add_field => { "[event][module]" => "syslog" "[event][dataset]" => "syslog" }
  }

  if "rfc5424" in [tags] {
    grok {
      match => { "message" => "<%{NONNEGINT:[log][syslog][priority]}>%{NONNEGINT:[log][syslog][version]} +%{TIMESTAMP_ISO8601:[@metadata][ts]} +%{NOTSPACE:[host][name]} +%{NOTSPACE:[process][name]} +%{NOTSPACE:[process][pid]} +%{NOTSPACE:[log][syslog][msgid]} +(?:-|\[.*?\]) ?%{GREEDYDATA:[@metadata][msg]}" }
      tag_on_failure => ["_syslog_grok_fail"]
    }
  } else {
    grok {
      match => { "message" => [
        "<%{NONNEGINT:[log][syslog][priority]}>%{SYSLOGTIMESTAMP:[@metadata][ts]} %{SYSLOGHOST:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[@metadata][msg]}",
        "%{SYSLOGTIMESTAMP:[@metadata][ts]} %{SYSLOGHOST:[host][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[@metadata][msg]}"
      ] }
      tag_on_failure => ["_syslog_grok_fail"]
    }
  }

  if [@metadata][msg] {
    mutate { replace => { "message" => "%{[@metadata][msg]}" } }
  }
  # UDP datagrams keep the sender's trailing newline
  mutate { strip => ["message"] }
  if [@metadata][ts] {
    date {
      match  => ["[@metadata][ts]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    id                          => "syslog_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => false
    data_stream_type            => "logs"
    data_stream_dataset         => "syslog"
    data_stream_namespace       => "${ES_NAMESPACE:default}"
  }
}
