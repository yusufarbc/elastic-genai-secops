# Pipeline: paloalto-syslog
# Input:  PAN-OS syslog (default BSD format, CSV payload) on 5517/udp and 5517/tcp
#         PAN-OS: Device > Server Profiles > Syslog -> server <logstash>, port 5517
# Output: data stream logs-paloalto-<namespace>
#
# The first 31 CSV columns are shared by TRAFFIC and THREAT logs and are mapped to ECS here.
# Other log types (SYSTEM, CONFIG, ...) are stored with the raw message.
# For full parsing of every log type use the Filebeat panw path (logstash-beats.conf).

input {
  udp { id => "paloalto_udp_5517" port => 5517 }
  tcp { id => "paloalto_tcp_5517" port => 5517 }
}

filter {
  mutate {
    add_tag   => ["paloalto", "network", "firewall"]
    add_field => {
      "[event][module]"    => "paloalto"
      "[event][dataset]"   => "paloalto"
      "[observer][vendor]" => "Palo Alto Networks"
      "[observer][type]"   => "firewall"
    }
  }

  grok {
    match => { "message" => "^(?:<%{NONNEGINT:[log][syslog][priority]}>)?(?:%{SYSLOGTIMESTAMP} %{SYSLOGHOST:[observer][hostname]} )?%{GREEDYDATA:[@metadata][csv]}$" }
    tag_on_failure => ["_paloalto_grok_fail"]
  }

  if [@metadata][csv] {
    csv {
      source  => "[@metadata][csv]"
      target  => "[paloalto]"
      columns => [
        "future_use1", "receive_time", "serial", "type", "subtype", "future_use2", "generated_time",
        "src", "dst", "natsrc", "natdst", "rule", "srcuser", "dstuser", "app", "vsys",
        "from_zone", "to_zone", "inbound_if", "outbound_if", "logset", "future_use3",
        "sessionid", "repeatcnt", "sport", "dport", "natsport", "natdport", "flags", "proto", "action"
      ]
      skip_empty_columns => true
    }
  }

  if [paloalto][type] in ["TRAFFIC", "THREAT"] {
    mutate {
      copy => {
        "[paloalto][src]"       => "[source][ip]"
        "[paloalto][sport]"     => "[source][port]"
        "[paloalto][dst]"       => "[destination][ip]"
        "[paloalto][dport]"     => "[destination][port]"
        "[paloalto][proto]"     => "[network][transport]"
        "[paloalto][app]"       => "[network][application]"
        "[paloalto][action]"    => "[event][action]"
        "[paloalto][rule]"      => "[rule][name]"
        "[paloalto][srcuser]"   => "[source][user][name]"
        "[paloalto][from_zone]" => "[observer][ingress][zone]"
        "[paloalto][to_zone]"   => "[observer][egress][zone]"
        "[paloalto][serial]"    => "[observer][serial_number]"
      }
    }
    mutate { convert => { "[source][port]" => "integer" "[destination][port]" => "integer" } }
  }

  if [paloalto][generated_time] {
    date {
      match    => ["[paloalto][generated_time]", "yyyy/MM/dd HH:mm:ss"]
      timezone => "${PANOS_TZ:UTC}"
      target   => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    id                          => "paloalto_syslog_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => false
    data_stream_type            => "logs"
    data_stream_dataset         => "paloalto"
    data_stream_namespace       => "${ES_NAMESPACE:default}"
  }
}
