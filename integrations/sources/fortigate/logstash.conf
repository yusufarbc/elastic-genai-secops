# Pipeline: fortigate
# Input:  FortiGate syslog (key=value format) on 5516/udp and 5516/tcp
#         FortiOS: config log syslogd setting -> set server <logstash> / set port 5516 / set format default
# Output: data stream logs-fortigate-<namespace>

input {
  udp { id => "fortigate_udp_5516" port => 5516 }
  tcp { id => "fortigate_tcp_5516" port => 5516 }
}

filter {
  mutate {
    add_tag   => ["fortigate", "network", "firewall"]
    add_field => {
      "[event][module]"  => "fortigate"
      "[event][dataset]" => "fortigate"
      "[observer][vendor]" => "Fortinet"
      "[observer][type]"   => "firewall"
    }
  }

  # Strip the optional "<pri>" prefix and optional BSD header, keep the key=value payload
  grok {
    match => { "message" => "^(?:<%{NONNEGINT:[log][syslog][priority]}>)?(?:%{SYSLOGTIMESTAMP} %{SYSLOGHOST} )?%{GREEDYDATA:[@metadata][kv]}$" }
    tag_on_failure => ["_fortigate_grok_fail"]
  }

  kv {
    source         => "[@metadata][kv]"
    target         => "fortigate"
    field_split    => " "
    value_split    => "="
    trim_value     => "\""
    tag_on_failure => ["_fortigate_kv_fail"]
  }

  if [fortigate][date] and [fortigate][time] {
    mutate { add_field => { "[@metadata][ts]" => "%{[fortigate][date]} %{[fortigate][time]}" } }
    date {
      match    => ["[@metadata][ts]", "yyyy-MM-dd HH:mm:ss"]
      timezone => "${FORTIGATE_TZ:UTC}"
      target   => "@timestamp"
    }
  }

  # ECS mapping of the most used FortiOS fields
  mutate {
    copy => {
      "[fortigate][srcip]"   => "[source][ip]"
      "[fortigate][srcport]" => "[source][port]"
      "[fortigate][dstip]"   => "[destination][ip]"
      "[fortigate][dstport]" => "[destination][port]"
      "[fortigate][action]"  => "[event][action]"
      "[fortigate][devname]" => "[observer][name]"
      "[fortigate][service]" => "[network][protocol]"
      "[fortigate][user]"    => "[user][name]"
      "[fortigate][msg]"     => "[message]"
    }
  }
  mutate {
    convert => { "[source][port]" => "integer" "[destination][port]" => "integer" }
  }
}

output {
  elasticsearch {
    id                          => "fortigate_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => false
    data_stream_type            => "logs"
    data_stream_dataset         => "fortigate"
    data_stream_namespace       => "${ES_NAMESPACE:default}"
  }
}
